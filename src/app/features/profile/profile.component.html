<app-top-bar [title]="'common.appName' | translate" />

<main class="profile">
  <section class="profile-card">
    <span class="profile-card__avatar"><app-icon name="user" /></span>
    <div>
      <p class="profile-card__name">{{ 'profile.name' | translate }}</p>
      <p class="profile-card__subtitle">{{ 'profile.subtitle' | translate }}</p>
    </div>
  </section>

  <section class="settings-list">
    <div class="settings-row">
      <span class="settings-row__label">{{ 'profile.language' | translate }}</span>
      <app-language-switcher />
    </div>
    <button
      type="button"
      class="settings-row settings-row--button settings-row--toggle"
      role="switch"
      [attr.aria-checked]="themeService.isDark()"
      (click)="toggleTheme()"
    >
      <span class="settings-row__label">{{ 'profile.darkMode' | translate }}</span>
      <span class="switch" [class.switch--on]="themeService.isDark()"></span>
    </button>
  </section>
</main>
