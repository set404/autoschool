<app-top-bar [title]="'common.appName' | translate" />

<main class="profile">
  <section class="profile-card">
    <span class="profile-card__avatar"><app-icon name="user" /></span>
    <div>
      <p class="profile-card__name">{{ currentUser()?.name }}</p>
      <p class="profile-card__subtitle">{{ currentUser()?.email }}</p>
    </div>
  </section>

  @if (currentUser()?.role === 'TEACHER') {
    <section class="settings-list">
      <a class="settings-row settings-row--button" routerLink="/teacher">
        <span class="settings-row__label">{{ 'teacher.heading' | translate }}</span>
        <app-icon name="chevron-right" />
      </a>
    </section>
  }

  @if (currentUser()?.role === 'ADMIN') {
    <section class="settings-list">
      <a class="settings-row settings-row--button" routerLink="/admin">
        <span class="settings-row__label">{{ 'admin.heading' | translate }}</span>
        <app-icon name="chevron-right" />
      </a>
    </section>
  }

  <section class="settings-list">
    <div class="settings-row">
      <span class="settings-row__label">{{ 'profile.language' | translate }}</span>
      <app-language-switcher />
    </div>
    <button
      type="button"
      class="settings-row settings-row--button settings-row--toggle"
      role="switch"
      [attr.aria-checked]="themeService.isDark()"
      (click)="toggleTheme()"
    >
      <span class="settings-row__label">{{ 'profile.darkMode' | translate }}</span>
      <span class="switch" [class.switch--on]="themeService.isDark()"></span>
    </button>
    <button type="button" class="settings-row settings-row--button" (click)="logout()">
      <span class="settings-row__label">{{ 'profile.logOut' | translate }}</span>
    </button>
  </section>
</main>
