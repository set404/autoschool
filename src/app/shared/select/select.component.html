<div class="sel">
  <button
    type="button"
    class="sel__trigger"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <span class="sel__value" [class.sel__value--placeholder]="!selectedLabel()">
      {{ selectedLabel() || placeholder() }}
    </span>
    <app-icon name="chevron-down" />
  </button>

  @if (open()) {
    <ul class="sel__panel" role="listbox">
      @for (option of options(); track option.value) {
        <li>
          <button
            type="button"
            class="sel__option"
            [class.sel__option--selected]="option.value === value()"
            role="option"
            [attr.aria-selected]="option.value === value()"
            (click)="choose(option)"
          >
            {{ option.label }}
          </button>
        </li>
      }
    </ul>
  }
</div>
