<header class="top-bar" [class.top-bar--dark]="dark()">
  <div class="top-bar__leading">
    <button type="button" class="top-bar__icon-button" aria-label="menu">
      <app-icon name="menu" />
    </button>
    <h1 class="top-bar__title">{{ title() }}</h1>
  </div>
  <div class="top-bar__trailing">
    <ng-content select="[trailing]" />
  </div>
</header>
