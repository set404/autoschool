name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build --base-href /autoschool/

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp dist/autoschool-app/browser/index.html dist/autoschool-app/browser/404.html
          touch dist/autoschool-app/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/autoschool-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4